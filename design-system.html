<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TOVELU • Master Google Gemini Design System (Adaptive)</title>
  
  <!-- Favicon: Official Tovelu Mitosis Bio-Cell Logo (Bright Luminous) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23131314'/%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Google Sans, Roboto, Ubuntu, JetBrains Mono & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700;800&family=Ubuntu:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- TDS Gemini CSS Framework -->
  <link rel="stylesheet" href="tovelu-design-system.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--gemini-bg);
      color: var(--gemini-text-main);
      font-family: 'Google Sans Text', 'Roboto', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Top Gateway Bar */
    header.master-header {
      height: 64px;
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--gemini-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gemini-border-subtle);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-wordmark {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 500;
      font-size: 24px;
      color: var(--gemini-text-main);
    }

    /* Gateway Direct Links */
    .gateway-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      background: var(--gemini-surface-container);
      color: var(--gemini-text-main);
      text-decoration: none;
      transition: all 0.15s;
    }
    .gateway-pill:hover {
      background: var(--gemini-sparkle-blue);
      color: #FFFFFF;
    }

    /* Iframe / Frame Container */
    .embed-stage {
      flex: 1;
      display: flex;
      justify-content: center;
      width: 100%;
      background: var(--gemini-bg);
    }

    iframe#stage-frame {
      width: 100%;
      height: calc(100vh - 64px);
      border: none;
      background: var(--gemini-bg);
      transition: max-width 0.3s cubic-bezier(0.2, 0, 0, 1), border 0.3s, box-shadow 0.3s;
    }

    /* Device Framing */
    .view-desktop iframe#stage-frame {
      max-width: 100%;
    }
    .view-tablet iframe#stage-frame {
      max-width: 768px;
      height: 90vh;
      margin: 20px auto;
      border: 8px solid var(--gemini-border);
      border-radius: 36px;
      box-shadow: var(--gemini-shadow-lg);
    }
    .view-mobile iframe#stage-frame {
      max-width: 412px;
      height: 92vh;
      margin: 20px auto;
      border: 10px solid var(--gemini-text-main);
      border-radius: 46px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.35);
    }
  </style>
</head>
<body class="view-desktop" id="body-container">

  <!-- Master Header Gateway -->
  <header class="master-header">
    <div class="brand-lockup">
      <div class="tovelu-mitosis-anim">
        <svg width="32" height="32" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
          <path d="M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z" fill="url(#gw-c)"/>
          <path d="M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z" fill="url(#gw-e)"/>
          <circle cx="50" cy="50" r="8.5" fill="#00F5A0"/>
          <defs>
            <linearGradient id="gw-c" x1="16" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00C0FF"/><stop offset="1" stop-color="#0062FF"/></linearGradient>
            <linearGradient id="gw-e" x1="84" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5A0"/><stop offset="1" stop-color="#00D06C"/></linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-wordmark">tovelu</span>
      <span style="font-family: 'Google Sans', sans-serif; font-size: 11px; font-weight: 700; color: var(--gemini-sparkle-blue); background: var(--gemini-surface-container); padding: 3px 8px; border-radius: 9999px;">
        LOCKED STANDARD
      </span>
    </div>

    <!-- Direct Viewport Switchers -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="desktop-design-system.html" target="_blank" class="gateway-pill" title="Open full desktop in new tab">
        <span class="material-symbols-outlined" style="font-size: 16px;">laptop</span> Desktop Spec
      </a>
      <a href="mobile-design-system.html" target="_blank" class="gateway-pill" title="Open full mobile in new tab">
        <span class="material-symbols-outlined" style="font-size: 16px;">smartphone</span> Mobile Spec
      </a>
      <a href="survey.html" class="gemini-btn gemini-btn-primary" style="height: 34px; padding: 0 14px; font-size: 12px;">
        Survey ➔
      </a>
    </div>
  </header>

  <!-- Auto-Adaptive Embed Stage -->
  <div class="embed-stage">
    <iframe id="stage-frame" src="desktop-design-system.html"></iframe>
  </div>

  <script>
    // Automatic Device Routing Logic (Locked Platform Standard)
    function autoRouteDevice() {
      const w = window.innerWidth;
      const frame = document.getElementById('stage-frame');
      const body = document.getElementById('body-container');

      if (w < 768) {
        // Mobile Phones & Web App -> Mobile Design System
        frame.src = "mobile-design-system.html";
        body.className = "view-mobile";
      } else {
        // Desktop, Laptop, and Tablets -> Desktop Design System
        frame.src = "desktop-design-system.html";
        body.className = "view-desktop";
      }
    }

    // Run on initial load and window resize
    window.addEventListener('load', autoRouteDevice);
  </script>
</body>
</html>

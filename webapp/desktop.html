<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tovelu • Desktop Health OS (Full Screen)</title>
  
  <!-- Favicon: Official Tovelu Mitosis Bio-Cell Logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />

  <!-- Google Fonts & TDS Framework -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700;800&family=Ubuntu:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="tovelu-design-system.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--gemini-bg);
      font-family: 'Google Sans Text', 'Roboto', sans-serif;
    }
    .desktop-top-control-bar {
      height: 48px;
      background: var(--gemini-surface);
      border-bottom: 1px solid var(--gemini-border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--gemini-text-muted);
      z-index: 100;
    }
    .desktop-frame-container {
      width: 100%;
      height: calc(100% - 48px);
      background: var(--gemini-surface-container);
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    iframe#desktop-app-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>

  <!-- Top Control Utility Bar -->
  <div class="desktop-top-control-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="material-symbols-outlined" style="color: var(--gemini-sparkle-blue); font-size: 20px;">desktop_windows</span>
      <span style="font-family: 'Google Sans', sans-serif; font-weight: 800; color: var(--gemini-text-main);">Tovelu Desktop Web App (Full Screen 1200px)</span>
      <span style="font-size: 11px; background: rgba(0, 208, 108, 0.12); color: var(--gemini-vitality-emerald); padding: 2px 8px; border-radius: 9999px; font-weight: 800;">
        MATERIAL 3 EXPANDED
      </span>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="mobile.html" style="color: var(--gemini-sparkle-blue); text-decoration: none; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 18px;">smartphone</span>
        <span>Switch to Mobile View</span>
      </a>
      <a href="app.html" target="_blank" style="color: var(--gemini-text-muted); text-decoration: none; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 16px;">open_in_new</span>
        <span>Open Raw URL</span>
      </a>
    </div>
  </div>

  <!-- Full Screen Desktop Application Container -->
  <div class="desktop-frame-container">
    <iframe id="desktop-app-frame" src="app.html"></iframe>
  </div>

</body>
</html>

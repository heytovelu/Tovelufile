<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TOVELU • Mobile Health Intelligence Intake Survey</title>
  
  <!-- Favicon: Official Tovelu Mitosis Bio-Cell Logo (Bright Luminous) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Google Sans, Roboto, Ubuntu, JetBrains Mono & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700;800&family=Ubuntu:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- TDS Gemini CSS Framework -->
  <link rel="stylesheet" href="tovelu-design-system.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--gemini-bg);
      color: var(--gemini-text-main);
      font-family: 'Google Sans Text', 'Roboto', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Top Sticky App Bar */
    header.mobile-survey-header {
      width: 100%;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--gemini-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--gemini-border-subtle);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-wordmark {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 500;
      font-size: 22px;
      color: var(--gemini-text-main);
    }

    /* Native Smartphone Frame */
    .phone-survey-container {
      width: 100%;
      max-width: 412px;
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      background: var(--gemini-bg);
      position: relative;
    }

    /* Mobile Status Bar */
    .mobile-status-bar {
      height: 38px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--gemini-text-main);
    }

    /* Question Scroll Area */
    .mobile-survey-content {
      padding: 12px 16px 110px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .question-title {
      font-family: 'Google Sans Display', 'Google Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--gemini-text-main);
    }
    .question-subtitle {
      font-size: 13px;
      color: var(--gemini-text-muted);
      line-height: 1.45;
      margin-top: 4px;
    }

    /* Option List */
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    /* Fixed Bottom Action Bar */
    .mobile-docked-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 412px;
      z-index: 100;
      background: var(--gemini-bg);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--gemini-border-subtle);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
    }
    .time-select {
      background: var(--gemini-surface);
      border: 1.5px solid var(--gemini-border);
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gemini-text-main);
      outline: none;
      text-align: center;
    }

    .alert-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Mobile Bar -->
  <header class="mobile-survey-header">
    <div class="brand-lockup">
      <!-- TOVELU MITOSIS LOGO (RAZOR SHARP) -->
      <div class="tovelu-mitosis-anim">
        <svg width="28" height="28" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
          <path d="M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z" fill="url(#ms-cyan)"/>
          <path d="M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z" fill="url(#ms-emerald)"/>
          <circle cx="50" cy="50" r="8.5" fill="#00F5A0"/>
          <defs>
            <linearGradient id="ms-cyan" x1="16" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00C0FF"/><stop offset="1" stop-color="#0062FF"/></linearGradient>
            <linearGradient id="ms-emerald" x1="84" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5A0"/><stop offset="1" stop-color="#00D06C"/></linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-wordmark">tovelu</span>
    </div>

    <!-- Progress Indicator -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <span id="step-name" style="font-size: 11px; font-weight: 700; color: var(--gemini-text-muted);">Q1 of 34</span>
      <button class="gemini-btn gemini-btn-tonal" style="height: 30px; padding: 0 8px; font-size: 11px;" onclick="toggleTheme()">
        <span class="material-symbols-outlined" id="theme-icon-sym" style="font-size: 14px;">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- Slim Progress Bar -->
  <div style="width: 100%; height: 3px; background: var(--gemini-surface-container); overflow: hidden;">
    <div id="survey-progress-fill" style="height: 100%; width: 3%; background: var(--gemini-gradient-btn); transition: width 0.2s;"></div>
  </div>

  <!-- Smartphone Frame -->
  <div class="phone-survey-container">
    
    <!-- Status Bar -->
    <div class="mobile-status-bar">
      <span>09:41</span>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 14px;">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size: 14px;">wifi</span>
        <span class="material-symbols-outlined" style="font-size: 16px;">battery_full</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="mobile-survey-content">
      <div id="survey-alert" class="alert-banner">Please select an option to continue.</div>
      <div id="survey-content-area"></div>
    </div>

    <!-- Docked Bottom Navigation Bar -->
    <div class="mobile-docked-nav">
      <button class="gemini-btn gemini-btn-tonal" id="btn-prev" onclick="prevQuestion()" disabled style="height: 48px; padding: 0 16px;">
        ‹ Back
      </button>
      <button class="gemini-btn gemini-btn-primary" id="btn-next" onclick="nextQuestion()" style="height: 48px; flex: 1;">
        Continue ➔
      </button>
    </div>

  </div>

  <!-- Survey Logic -->
  <script>
    let currentQIndex = 0;
    let userAnswers = {};

    const COUNTRIES = [
      "India", "United States", "United Kingdom", "United Arab Emirates", "Australia", "Canada", "Germany", "Singapore"
    ];

    const SURVEY_QUESTIONS = [
      {
        id: "sex",
        title: "1. Biological Sex at Birth",
        subtitle: "To calibrate your natural hormone baseline and basal calorie burn.",
        type: "single",
        options: [
          { emoji: "👨", title: "Male", desc: "Calibrate male androgen & metabolic baseline." },
          { emoji: "👩", title: "Female", desc: "Calibrate female ovulatory & metabolic baseline." }
        ]
      },
      {
        id: "dob",
        title: "2. Date of Birth",
        subtitle: "To calculate exact chronological age for DNAm biological clock tracking.",
        type: "dob"
      },
      {
        id: "height",
        title: "3. Height",
        subtitle: "Used to determine body surface area and ideal metabolic proportions.",
        type: "height"
      },
      {
        id: "dopamine_1",
        type: "dopamine",
        badge: "⚡ METABOLIC BASELINE",
        gauge: {
          title: "BASAL ENERGY EXPENDITURE (BMR)",
          value: "1,740 kcal / day",
          percentile: "Top 11.2% Metabolic Profile",
          barWidth: "78%"
        },
        data: "Only 8.4% of humans share your exact metabolic profile. Your biology is unique.",
        quote: "Natural forces within us are the true healers of disease.",
        author: "Hippocrates"
      },
      {
        id: "weight",
        title: "4. Current Weight",
        subtitle: "Used to calculate daily protein absorption and basal metabolic expenditure.",
        type: "weight"
      },
      {
        id: "dietary_lifestyle",
        title: "5. Dietary Lifestyle",
        subtitle: "We calibrate a 100% whole-food, zero-seed-oil plan tailored to you.",
        type: "single",
        options: [
          { emoji: "🥩", title: "Omnivore / Whole Foods", desc: "Meat, fish, eggs, fruits, vegetables, dairy." },
          { emoji: "🌱", title: "Vegetarian", desc: "Plant-based plus dairy and eggs." },
          { emoji: "🌿", title: "Pure Vegan", desc: "100% plant-based whole foods." }
        ]
      },
      {
        id: "time_wake",
        title: "6. Wake Up Time",
        subtitle: "To calculate your morning cortisol spike and breakfast window.",
        type: "time_wake"
      },
      {
        id: "time_sleep",
        title: "7. Bedtime",
        subtitle: "To calculate your melatonin window and overnight cellular autophagy.",
        type: "time_sleep"
      },
      {
        id: "primary_goal",
        title: "8. Primary Health Goal",
        subtitle: "Your entire 90-day protocol will be calibrated to achieve this outcome first.",
        type: "single",
        options: [
          { emoji: "🔥", title: "Burn Visceral Belly Fat", desc: "Calibrate lipolytic fat oxidation." },
          { emoji: "⚡", title: "Stop Afternoon Energy Crashes", desc: "Flatten blood glucose spikes." },
          { emoji: "🧬", title: "Reverse Biological Aging", desc: "De-accelerate DNAm pace of aging." }
        ]
      },
      {
        id: "dopamine_final",
        type: "dopamine",
        isFinal: true,
        badge: "🎉 INTAKE COMPLETE",
        gauge: {
          title: "EPIGENETIC AGE TRAJECTORY",
          value: "25.8 Yrs (-4.2 Saved)",
          percentile: "Top 4.8% Regeneration Rate",
          barWidth: "88%"
        },
        data: "All markers verified against WHO ICD-11 logic. Protocol generated.",
        quote: "Let food be thy medicine.",
        author: "Hippocrates"
      }
    ];

    function renderCurrentQuestion() {
      const q = SURVEY_QUESTIONS[currentQIndex];
      const stage = document.getElementById('survey-content-area');
      const progress = Math.round(((currentQIndex + 1) / SURVEY_QUESTIONS.length) * 100);

      document.getElementById('step-name').innerText = `Q${currentQIndex + 1} of ${SURVEY_QUESTIONS.length}`;
      document.getElementById('survey-progress-fill').style.width = `${progress}%`;
      document.getElementById('btn-prev').disabled = currentQIndex === 0;

      hideAlert();

      if (q.type === 'dopamine') {
        stage.innerHTML = `
          <div class="gemini-card" style="text-align: center; padding: 24px 18px; display: flex; flex-direction: column; gap: 14px;">
            <div><span style="font-size: 10px; font-weight: 800; color: var(--gemini-vitality-emerald); background: var(--gemini-surface-container); padding: 3px 10px; border-radius: 9999px;">${q.badge}</span></div>
            <div style="font-family: 'Google Sans Display', sans-serif; font-size: 26px; font-weight: 800;">${q.gauge.value}</div>
            <div style="font-size: 12px; font-weight: 700; color: var(--gemini-sparkle-blue);">${q.gauge.percentile}</div>
            <div style="height: 6px; background: var(--gemini-surface-container); border-radius: 9999px; overflow: hidden;">
              <div style="height: 100%; width: ${q.gauge.barWidth}; background: var(--gemini-gradient-btn);"></div>
            </div>
            <p style="font-size: 12px; color: var(--gemini-text-muted); line-height: 1.5;">${q.data}</p>
          </div>
        `;
        document.getElementById('btn-next').innerText = q.isFinal ? "Unlock Protocol ➔" : "Next ➔";
        return;
      }

      document.getElementById('btn-next').innerText = "Continue ➔";

      let optionsHTML = '';
      if (q.type === 'single') {
        optionsHTML = `
          <div class="option-list">
            ${q.options.map((opt, i) => {
              const isSel = userAnswers[q.id] === opt.title;
              return `
                <div class="gemini-option-card ${isSel ? 'selected' : ''}" onclick="selectSingleOption('${q.id}', '${opt.title.replace(/'/g, "\\'")}', this)">
                  <div class="gemini-check-circle">${isSel ? '✓' : ''}</div>
                  <span style="font-size: 22px;">${opt.emoji}</span>
                  <div style="flex: 1;">
                    <div style="font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 14px;">${opt.title}</div>
                    <div style="font-size: 11px; color: var(--gemini-text-muted);">${opt.desc}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'dob') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; gap: 8px;">
            <select class="time-select" id="dob-day" style="flex: 1;">
              ${Array.from({length: 31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
            </select>
            <select class="time-select" id="dob-month" style="flex: 1.4;">
              ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map(m => `<option value="${m}">${m}</option>`).join('')}
            </select>
            <select class="time-select" id="dob-year" style="flex: 1.2;">
              ${Array.from({length: 70}, (_, i) => `<option value="${2024 - i}">${2024 - i}</option>`).join('')}
            </select>
          </div>
        `;
      } else if (q.type === 'height') {
        optionsHTML = `
          <div class="gemini-card">
            <input type="number" class="gemini-prompt-input" id="input-height-cm" placeholder="175 cm" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 18px; font-weight: 700; width: 100%;" value="${userAnswers['height_num'] || '175'}" />
          </div>
        `;
      } else if (q.type === 'weight') {
        optionsHTML = `
          <div class="gemini-card">
            <input type="number" class="gemini-prompt-input" id="input-weight" placeholder="70 kg" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 18px; font-weight: 700; width: 100%;" value="${userAnswers['weight_num'] || '70'}" />
          </div>
        `;
      } else if (q.type === 'time_wake' || q.type === 'time_sleep') {
        const presets = q.type === 'time_wake' ? ["06:00 AM", "06:30 AM", "07:00 AM", "07:30 AM"] : ["10:00 PM", "10:30 PM", "11:00 PM", "11:30 PM"];
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 12px;">
            <div style="font-weight: 700; font-size: 11px; color: var(--gemini-text-muted); text-transform: uppercase;">1-Tap Presets</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              ${presets.map(p => `<div class="gemini-chip ${userAnswers[q.id] === p ? 'active' : ''}" onclick="selectTimePreset('${q.id}', '${p}')">${p}</div>`).join('')}
            </div>
          </div>
        `;
      }

      stage.innerHTML = `
        <div>
          <h2 class="question-title">${q.title}</h2>
          <p class="question-subtitle">${q.subtitle}</p>
        </div>
        ${optionsHTML}
      `;
    }

    function selectSingleOption(qId, title, card) {
      userAnswers[qId] = title;
      document.querySelectorAll('.gemini-option-card').forEach(c => {
        c.classList.remove('selected');
        c.querySelector('.gemini-check-circle').innerText = '';
      });
      card.classList.add('selected');
      card.querySelector('.gemini-check-circle').innerText = '✓';
      hideAlert();
      setTimeout(nextQuestion, 160);
    }

    function selectTimePreset(qId, val) {
      userAnswers[qId] = val;
      document.querySelectorAll('.gemini-chip').forEach(c => c.classList.toggle('active', c.innerText === val));
      hideAlert();
    }

    function saveInputs() {
      const q = SURVEY_QUESTIONS[currentQIndex];
      if (!q) return;
      if (q.type === 'dob') {
        userAnswers['dob'] = `${document.getElementById('dob-day').value} ${document.getElementById('dob-month').value} ${document.getElementById('dob-year').value}`;
      } else if (q.type === 'height') {
        userAnswers['height'] = `${document.getElementById('input-height-cm').value} cm`;
      } else if (q.type === 'weight') {
        userAnswers['weight'] = `${document.getElementById('input-weight').value} kg`;
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        saveInputs();
        currentQIndex--;
        renderCurrentQuestion();
      }
    }

    function nextQuestion() {
      const q = SURVEY_QUESTIONS[currentQIndex];
      if (q && q.type === 'dopamine' && q.isFinal) {
        finish();
        return;
      }
      saveInputs();
      if (q && q.type === 'single' && !userAnswers[q.id]) {
        showAlert('Please select an option to continue.');
        return;
      }
      if (currentQIndex < SURVEY_QUESTIONS.length - 1) {
        currentQIndex++;
        renderCurrentQuestion();
      } else {
        finish();
      }
    }

    function showAlert(msg) {
      const el = document.getElementById('survey-alert');
      el.innerText = msg;
      el.style.display = 'block';
    }
    function hideAlert() {
      const el = document.getElementById('survey-alert');
      if (el) el.style.display = 'none';
    }

    function finish() {
      localStorage.setItem('tovelu_survey_answers', JSON.stringify(userAnswers));
      window.location.href = "index.html";
    }

    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme') || 'light';
      const nxt = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nxt);
      document.body.className = nxt === 'dark' ? 'tds-theme-dark' : '';
      document.getElementById('theme-icon-sym').innerText = nxt === 'dark' ? 'light_mode' : 'dark_mode';
    }

    window.addEventListener('load', renderCurrentQuestion);
  </script>
</body>
</html>

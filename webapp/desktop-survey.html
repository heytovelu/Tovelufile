<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TOVELU • Desktop Health Intelligence Intake Survey (42 Precision Markers)</title>
  
  <!-- Favicon: Official Tovelu Mitosis Bio-Cell Logo (Razor Sharp) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Google Sans, Roboto, Ubuntu, JetBrains Mono & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700;800&family=Ubuntu:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- TDS Gemini CSS Framework -->
  <link rel="stylesheet" href="tovelu-design-system.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--gemini-bg);
      color: var(--gemini-text-main);
      font-family: 'Google Sans Text', 'Roboto', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Desktop Header */
    header.desktop-survey-header {
      height: 68px;
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--gemini-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gemini-border-subtle);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-wordmark {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 500;
      font-size: 26px;
      color: var(--gemini-text-main);
    }

    /* Centered Desktop Survey Container */
    .desktop-survey-container {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px 100px 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Main Question Stage */
    .question-stage {
      display: flex;
      flex-direction: column;
      gap: 28px;
      width: 100%;
      margin-top: 12px;
    }

    .question-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .question-title {
      font-family: 'Google Sans Display', 'Google Sans', sans-serif;
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: var(--gemini-text-main);
    }
    .question-subtitle {
      font-size: 15px;
      color: var(--gemini-text-muted);
      line-height: 1.55;
    }

    /* Option Card List */
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Visual 1-Tap Pickers & Sliders */
    .time-picker-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .time-select {
      background: var(--gemini-surface);
      border: 1.5px solid var(--gemini-border);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--gemini-text-main);
      outline: none;
      text-align: center;
      cursor: pointer;
    }
    .time-select:focus {
      border-color: var(--gemini-sparkle-blue);
    }

    /* Unit Switcher */
    .unit-toggle-wrap {
      display: inline-flex;
      background: var(--gemini-surface-container);
      padding: 3px;
      border-radius: 9999px;
      margin-bottom: 12px;
    }
    .unit-toggle-btn {
      background: transparent;
      border: none;
      color: var(--gemini-text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .unit-toggle-btn.active {
      background: var(--gemini-surface);
      color: var(--gemini-sparkle-blue);
      box-shadow: var(--gemini-shadow-sm);
    }

    /* Preset Range Pill Group */
    .range-presets-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .range-preset-pill {
      background: var(--gemini-surface-container);
      border: 1px solid var(--gemini-border-subtle);
      color: var(--gemini-text-main);
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .range-preset-pill:hover, .range-preset-pill.active {
      background: var(--gemini-sparkle-blue);
      color: #FFFFFF;
      border-color: var(--gemini-sparkle-blue);
    }

    /* Floating Desktop Action Bar */
    .desktop-bottom-actions {
      position: sticky;
      bottom: 24px;
      z-index: 90;
      background: var(--gemini-surface);
      border: 1px solid var(--gemini-border);
      border-radius: 9999px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--gemini-shadow-md);
      margin-top: 24px;
    }

    .alert-box {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Desktop Header -->
  <header class="desktop-survey-header">
    <div class="brand-lockup">
      <!-- TOVELU MITOSIS LOGO (RAZOR SHARP) -->
      <div class="tovelu-mitosis-anim">
        <svg width="34" height="34" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
          <path d="M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z" fill="url(#s-cyan)"/>
          <path d="M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z" fill="url(#s-emerald)"/>
          <circle cx="50" cy="50" r="8.5" fill="#00F5A0"/>
          <defs>
            <linearGradient id="s-cyan" x1="16" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00C0FF"/><stop offset="1" stop-color="#0062FF"/></linearGradient>
            <linearGradient id="s-emerald" x1="84" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5A0"/><stop offset="1" stop-color="#00D06C"/></linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-wordmark">tovelu</span>
    </div>

    <!-- Live Progress Bar -->
    <div style="display: flex; align-items: center; gap: 20px;">
      <div style="width: 220px; height: 6px; background: var(--gemini-surface-container); border-radius: 9999px; overflow: hidden;">
        <div id="survey-progress-fill" style="height: 100%; width: 2%; background: var(--gemini-gradient-btn); transition: width 0.25s ease-out;"></div>
      </div>

      <a href="mobile-survey.html" class="gemini-btn gemini-btn-tonal" style="height: 36px; padding: 0 14px; font-size: 12px;">
        <span class="material-symbols-outlined" style="font-size: 16px;">smartphone</span> Mobile View
      </a>
      <button class="gemini-btn gemini-btn-tonal" style="height: 36px; padding: 0 12px;" onclick="toggleTheme()">
        <span class="material-symbols-outlined" id="theme-icon-sym" style="font-size: 16px;">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- Centered Desktop Survey Container -->
  <div class="desktop-survey-container">
    <main class="question-stage">
      
      <div id="survey-alert" class="alert-box">Please select an option above to continue.</div>

      <!-- Dynamic Question Content -->
      <div id="survey-content-area"></div>

      <!-- Desktop Floating Action Bar -->
      <div class="desktop-bottom-actions">
        <button class="gemini-btn gemini-btn-tonal" id="btn-prev" onclick="prevQuestion()" disabled style="height: 40px; padding: 0 20px;">
          ‹ Back
        </button>
        <button class="gemini-btn gemini-btn-primary" id="btn-next" onclick="nextQuestion()" style="height: 40px; padding: 0 26px;">
          Continue ➔
        </button>
      </div>

    </main>
  </div>

  <!-- Load Master 42-Question Dataset -->
  <script src="survey-data.js"></script>

  <!-- Survey Controller Script -->
  <script>
    let currentQIndex = 0;
    let userAnswers = {};

    function calculateRealtimeBMR() {
      const sex = userAnswers['sex'] || 'Male';
      const weight = parseFloat(userAnswers['weight_num']) || 70;
      const height = parseFloat(userAnswers['height_num']) || 175;
      const age = parseInt(userAnswers['calculated_age']) || 30;

      let bmr = 0;
      if (sex === 'Male') {
        bmr = Math.round(10 * weight + 6.25 * height - 5 * age + 5);
      } else {
        bmr = Math.round(10 * weight + 6.25 * height - 5 * age - 161);
      }
      
      const bmrElem = document.getElementById('telemetry-bmr-val');
      if (bmrElem) bmrElem.innerHTML = `${bmr.toLocaleString()} <span style="font-size: 14px; font-weight: 500; color: var(--gemini-text-muted);">kcal/day</span>`;
    }

    function renderCurrentQuestion() {
      const q = TOVELU_SURVEY_QUESTIONS[currentQIndex];
      const stage = document.getElementById('survey-content-area');
      const progress = Math.round(((currentQIndex + 1) / TOVELU_SURVEY_QUESTIONS.length) * 100);

      const fillElem = document.getElementById('survey-progress-fill');
      if (fillElem) fillElem.style.width = `${progress}%`;
      const prevBtn = document.getElementById('btn-prev');
      if (prevBtn) prevBtn.disabled = currentQIndex === 0;

      calculateRealtimeBMR();
      hideAlert();

      if (q.type === 'dopamine') {
        stage.innerHTML = `
          <div class="gemini-card" style="text-align: center; padding: 36px 28px; display: flex; flex-direction: column; gap: 18px;">
            <div><span style="font-size: 11px; font-weight: 800; color: var(--gemini-vitality-emerald); background: var(--gemini-surface-container); padding: 4px 12px; border-radius: 9999px;">${q.badge}</span></div>
            <div style="font-family: 'Google Sans Display', sans-serif; font-size: 34px; font-weight: 800; color: var(--gemini-text-main);">${q.gauge.value}</div>
            <div style="font-size: 14px; font-weight: 700; color: var(--gemini-sparkle-blue);">${q.gauge.percentile}</div>
            <div style="height: 8px; background: var(--gemini-surface-container); border-radius: 9999px; overflow: hidden; margin: 4px 0;">
              <div style="height: 100%; width: ${q.gauge.barWidth}; background: var(--gemini-gradient-btn);"></div>
            </div>
            <p style="font-size: 14px; color: var(--gemini-text-muted); line-height: 1.6;">${q.data}</p>
            <div style="border-left: 3px solid var(--gemini-sparkle-blue); background: var(--gemini-surface-container); padding: 12px 16px; border-radius: 0 12px 12px 0; text-align: left; font-style: italic; font-size: 13px; color: var(--gemini-text-muted);">
              "${q.quote}" — <strong>${q.author}</strong>
            </div>
          </div>
        `;
        document.getElementById('btn-next').innerText = q.isFinal ? "Unlock Full Protocol ➔" : "Next Milestone ➔";
        return;
      }

      document.getElementById('btn-next').innerText = "Continue ➔";

      let optionsHTML = '';
      if (q.type === 'single') {
        optionsHTML = `
          <div class="option-list">
            ${q.options.map((opt, i) => {
              const isSel = userAnswers[q.id] === opt.title;
              return `
                <div class="gemini-option-card ${isSel ? 'selected' : ''}" onclick="selectSingleOption('${q.id}', '${opt.title.replace(/'/g, "\\'")}', this)">
                  <div class="gemini-check-circle">${isSel ? '✓' : ''}</div>
                  <span style="font-size: 24px;">${opt.emoji}</span>
                  <div style="flex: 1;">
                    <div style="font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 15px;">${opt.title}</div>
                    <div style="font-size: 12px; color: var(--gemini-text-muted);">${opt.desc}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'multi') {
        if (!userAnswers[q.id]) userAnswers[q.id] = [];
        optionsHTML = `
          <div class="option-list">
            ${q.options.map((opt, i) => {
              const isSel = userAnswers[q.id].includes(opt.title);
              return `
                <div class="gemini-option-card ${isSel ? 'selected' : ''}" onclick="toggleMultiOption('${q.id}', '${opt.title.replace(/'/g, "\\'")}', this)">
                  <div class="gemini-check-circle">${isSel ? '✓' : ''}</div>
                  <span style="font-size: 24px;">${opt.emoji}</span>
                  <div style="flex: 1;">
                    <div style="font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 15px;">${opt.title}</div>
                    <div style="font-size: 12px; color: var(--gemini-text-muted);">${opt.desc}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'dob') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 14px;">
            <div style="display: flex; gap: 12px;">
              <select class="time-select" id="dob-day" style="flex: 1;" onchange="updateCalculatedAge()">
                ${Array.from({length: 31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
              </select>
              <select class="time-select" id="dob-month" style="flex: 1.5;" onchange="updateCalculatedAge()">
                ${["January","February","March","April","May","June","July","August","September","October","November","December"].map((m, idx) => `<option value="${idx+1}">${m}</option>`).join('')}
              </select>
              <select class="time-select" id="dob-year" style="flex: 1.2;" onchange="updateCalculatedAge()">
                ${Array.from({length: 85}, (_, i) => { const yr = (new Date().getFullYear()) - i; return `<option value="${yr}" ${yr===2001?'selected':''}>${yr}</option>`; }).join('')}
              </select>
            </div>
            <div id="dob-calculated-tag" style="background: var(--gemini-surface-container); padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--gemini-sparkle-blue); text-align: center;">
              👉 Calculated Age: 29 Years Old
            </div>
          </div>
        `;
      } else if (q.type === 'height') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 12px;">
            <div class="unit-toggle-wrap">
              <button class="unit-toggle-btn active" id="btn-cm" onclick="toggleHeightUnit('cm')">Metric (cm)</button>
              <button class="unit-toggle-btn" id="btn-ft" onclick="toggleHeightUnit('ft')">Imperial (ft / in)</button>
            </div>
            
            <div id="height-cm-wrap">
              <input type="number" class="gemini-prompt-input" id="input-height-cm" placeholder="175" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 800; width: 100%;" value="${userAnswers['height_num'] || '175'}" oninput="userAnswers['height_num']=this.value; calculateRealtimeBMR();" />
              
              <div style="font-size: 11px; font-weight: 700; color: var(--gemini-text-muted); margin-top: 10px; text-transform: uppercase;">1-Tap Common Heights:</div>
              <div class="range-presets-grid">
                ${[155, 160, 165, 170, 175, 180, 185, 190].map(h => `<div class="range-preset-pill ${userAnswers['height_num']==h ? 'active':''}" onclick="setHeightCm(${h})">${h} cm (${Math.floor(h/30.48)}'${Math.round((h%30.48)/2.54)}")</div>`).join('')}
              </div>
            </div>

            <div id="height-ft-wrap" style="display: none;">
              <div style="display: flex; gap: 12px;">
                <select class="time-select" id="height-feet" style="flex: 1;" onchange="convertFtToCm()">
                  <option value="4">4 Feet</option><option value="5" selected>5 Feet</option><option value="6">6 Feet</option><option value="7">7 Feet</option>
                </select>
                <select class="time-select" id="height-inches" style="flex: 1;" onchange="convertFtToCm()">
                  ${Array.from({length: 12}, (_, i) => `<option value="${i}" ${i===9?'selected':''}>${i} Inches</option>`).join('')}
                </select>
              </div>
            </div>
          </div>
        `;
      } else if (q.type === 'weight') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 12px;">
            <div class="unit-toggle-wrap">
              <button class="unit-toggle-btn active" id="btn-kg" onclick="toggleWeightUnit('kg')">kg (Kilograms)</button>
              <button class="unit-toggle-btn" id="btn-lbs" onclick="toggleWeightUnit('lbs')">lbs (Pounds)</button>
            </div>
            <input type="number" class="gemini-prompt-input" id="input-weight" placeholder="70" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 20px; font-weight: 800; width: 100%;" value="${userAnswers['weight_num'] || '70'}" oninput="userAnswers['weight_num']=this.value; calculateRealtimeBMR();" />
            
            <div style="font-size: 11px; font-weight: 700; color: var(--gemini-text-muted); margin-top: 10px; text-transform: uppercase;">1-Tap Common Ranges:</div>
            <div class="range-presets-grid">
              ${[55, 60, 65, 70, 75, 80, 85, 90, 95, 100].map(w => `<div class="range-preset-pill ${userAnswers['weight_num']==w ? 'active':''}" onclick="setWeightKg(${w})">${w} kg (${Math.round(w*2.20462)} lbs)</div>`).join('')}
            </div>
          </div>
        `;
      } else if (q.type === 'location') {
        const countriesList = (typeof TOVELU_GLOBAL_COUNTRIES !== 'undefined') ? TOVELU_GLOBAL_COUNTRIES : ["India", "United States", "United Kingdom", "United Arab Emirates", "Australia", "Canada", "Germany", "Singapore"];
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 14px;">
            <div>
              <label style="font-size: 12px; font-weight: 700; color: var(--gemini-text-muted); margin-bottom: 6px; display: block;">Select Your Country (230+ Countries):</label>
              <select class="time-select" id="loc-country" style="width: 100%; text-align: left; padding: 12px 14px;">
                ${countriesList.map(c => `<option value="${c}" ${c==='India'?'selected':''}>${c}</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="font-size: 12px; font-weight: 700; color: var(--gemini-text-muted); margin-bottom: 6px; display: block;">Your Current Postal / PIN Code:</label>
              <input type="text" class="gemini-prompt-input" id="loc-pincode" placeholder="e.g. 400001 or 90210 or SW1A 1AA" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 700; width: 100%;" value="${userAnswers['pincode'] || ''}" />
            </div>
          </div>
        `;
      } else if (q.type === 'time_wake' || q.type === 'time_sleep') {
        const presets = q.type === 'time_wake' 
          ? [
              { val: "05:30 AM", label: "🌅 05:30 AM (Early Sunrise)" },
              { val: "06:00 AM", label: "🌅 06:00 AM" },
              { val: "06:30 AM", label: "🌅 06:30 AM" },
              { val: "07:00 AM", label: "☀️ 07:00 AM (Recommended)" },
              { val: "07:30 AM", label: "☀️ 07:30 AM" },
              { val: "08:00 AM", label: "☀️ 08:00 AM" },
              { val: "08:30 AM", label: "☀️ 08:30 AM+" }
            ]
          : [
              { val: "09:30 PM", label: "🌙 09:30 PM (Early Sleep)" },
              { val: "10:00 PM", label: "🌙 10:00 PM" },
              { val: "10:30 PM", label: "🌙 10:30 PM (Recommended)" },
              { val: "11:00 PM", label: "🌙 11:00 PM" },
              { val: "11:30 PM", label: "🌙 11:30 PM" },
              { val: "12:00 AM", label: "🌌 12:00 AM (Midnight)" },
              { val: "12:30 AM", label: "🌌 12:30 AM+" }
            ];

        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 14px;">
            <div style="font-weight: 700; font-size: 12px; color: var(--gemini-text-muted); text-transform: uppercase;">1-Tap Exact Times (Zero Typing):</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
              ${presets.map(p => `
                <div class="range-preset-pill ${userAnswers[q.id] === p.val ? 'active' : ''}" style="text-align: center; padding: 12px;" onclick="selectTimePreset('${q.id}', '${p.val}')">
                  ${p.label}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      stage.innerHTML = `
        <div class="question-header">
          <h2 class="question-title">${q.title}</h2>
          <p class="question-subtitle">${q.subtitle}</p>
        </div>
        ${optionsHTML}
      `;
    }

    function selectSingleOption(qId, title, card) {
      userAnswers[qId] = title;
      document.querySelectorAll('.gemini-option-card').forEach(c => {
        c.classList.remove('selected');
        c.querySelector('.gemini-check-circle').innerText = '';
      });
      card.classList.add('selected');
      card.querySelector('.gemini-check-circle').innerText = '✓';
      hideAlert();
      setTimeout(nextQuestion, 180);
    }

    function toggleMultiOption(qId, title, card) {
      if (!userAnswers[qId]) userAnswers[qId] = [];
      const idx = userAnswers[qId].indexOf(title);
      if (idx > -1) {
        userAnswers[qId].splice(idx, 1);
        card.classList.remove('selected');
        card.querySelector('.gemini-check-circle').innerText = '';
      } else {
        userAnswers[qId].push(title);
        card.classList.add('selected');
        card.querySelector('.gemini-check-circle').innerText = '✓';
      }
      hideAlert();
    }

    function selectTimePreset(qId, val) {
      userAnswers[qId] = val;
      document.querySelectorAll('.range-preset-pill').forEach(c => c.classList.toggle('active', c.innerText.includes(val)));
      hideAlert();
      setTimeout(nextQuestion, 180);
    }

    function setHeightCm(h) {
      userAnswers['height_num'] = h;
      document.getElementById('input-height-cm').value = h;
      document.querySelectorAll('.range-preset-pill').forEach(p => p.classList.toggle('active', p.innerText.startsWith(h.toString())));
      calculateRealtimeBMR();
    }

    function setWeightKg(w) {
      userAnswers['weight_num'] = w;
      document.getElementById('input-weight').value = w;
      document.querySelectorAll('.range-preset-pill').forEach(p => p.classList.toggle('active', p.innerText.startsWith(w.toString())));
      calculateRealtimeBMR();
    }

    function toggleHeightUnit(u) {
      document.getElementById('btn-cm').className = u === 'cm' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('btn-ft').className = u === 'ft' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('height-cm-wrap').style.display = u === 'cm' ? 'block' : 'none';
      document.getElementById('height-ft-wrap').style.display = u === 'ft' ? 'block' : 'none';
    }

    function toggleWeightUnit(u) {
      document.getElementById('btn-kg').className = u === 'kg' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('btn-lbs').className = u === 'lbs' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
    }

    function convertFtToCm() {
      const ft = parseInt(document.getElementById('height-feet').value) || 5;
      const inch = parseInt(document.getElementById('height-inches').value) || 9;
      const cm = Math.round(ft * 30.48 + inch * 2.54);
      userAnswers['height_num'] = cm;
      calculateRealtimeBMR();
    }

    function updateCalculatedAge() {
      const d = parseInt(document.getElementById('dob-day').value) || 1;
      const m = parseInt(document.getElementById('dob-month').value) || 1;
      const y = parseInt(document.getElementById('dob-year').value) || 2001;
      
      const now = new Date();
      let age = now.getFullYear() - y;
      const monthDiff = (now.getMonth() + 1) - m;
      if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < d)) {
        age--;
      }
      if (age < 0) age = 0;

      userAnswers['calculated_age'] = age;
      userAnswers['dob'] = `${d}/${m}/${y}`;
      const tag = document.getElementById('dob-calculated-tag');
      if (tag) tag.innerText = `👉 Calculated Age: ${age} Years Old`;
      calculateRealtimeBMR();
    }

    function saveInputs() {
      const q = TOVELU_SURVEY_QUESTIONS[currentQIndex];
      if (!q) return;
      if (q.type === 'dob') {
        userAnswers['dob'] = `${document.getElementById('dob-day').value}/${document.getElementById('dob-month').value}/${document.getElementById('dob-year').value}`;
      } else if (q.type === 'height') {
        userAnswers['height_num'] = document.getElementById('input-height-cm').value;
        userAnswers['height'] = `${userAnswers['height_num']} cm`;
      } else if (q.type === 'weight') {
        userAnswers['weight_num'] = document.getElementById('input-weight').value;
        userAnswers['weight'] = `${userAnswers['weight_num']} kg`;
      } else if (q.type === 'location') {
        userAnswers['country'] = document.getElementById('loc-country').value;
        userAnswers['pincode'] = document.getElementById('loc-pincode').value;
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        saveInputs();
        currentQIndex--;
        renderCurrentQuestion();
      }
    }

    function nextQuestion() {
      const q = TOVELU_SURVEY_QUESTIONS[currentQIndex];
      if (q && q.type === 'dopamine' && q.isFinal) {
        finish();
        return;
      }
      saveInputs();
      if (q && q.type === 'single' && !userAnswers[q.id]) {
        showAlert('Please select an option to continue.');
        return;
      }
      if (q && q.type === 'multi' && (!userAnswers[q.id] || userAnswers[q.id].length === 0)) {
        showAlert('Please select at least one option to continue.');
        return;
      }
      if (currentQIndex < TOVELU_SURVEY_QUESTIONS.length - 1) {
        currentQIndex++;
        renderCurrentQuestion();
      } else {
        finish();
      }
    }

    function showAlert(msg) {
      const el = document.getElementById('survey-alert');
      el.innerText = msg;
      el.style.display = 'block';
    }
    function hideAlert() {
      const el = document.getElementById('survey-alert');
      if (el) el.style.display = 'none';
    }

    function finish() {
      localStorage.setItem('tovelu_survey_answers', JSON.stringify(userAnswers));
      window.location.href = "index.html";
    }

    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme') || 'light';
      const nxt = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nxt);
      document.body.className = nxt === 'dark' ? 'tds-theme-dark' : '';
      document.getElementById('theme-icon-sym').innerText = nxt === 'dark' ? 'light_mode' : 'dark_mode';
    }

    window.addEventListener('load', renderCurrentQuestion);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>tovelu — Toward better health</title>
  
  <!-- Locked Brand Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Ubuntu:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* 100-Year Color Architecture (Locked) */
      --primary: #1D4ED8;
      --primary-hover: #1E40AF;
      --luminous: #0EA5E9;
      --luminous-glow: rgba(14, 165, 233, 0.25);
      --vitality: #10B981;
      --vitality-deep: #059669;
      --vitality-glow: rgba(16, 185, 129, 0.25);
      
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-full: 9999px;
    }

    body.theme-dark {
      --canvas: #080B11;
      --surface: rgba(14, 19, 31, 0.65);
      --surface-elevated: rgba(21, 29, 46, 0.75);
      --surface-border: rgba(31, 44, 66, 0.7);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;
      --card-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      --dna-opacity: 0.65;
      --cell-glow: rgba(14, 165, 233, 0.15);
      --immune-glow: rgba(16, 185, 129, 0.18);
    }

    body.theme-light {
      --canvas: #F8FAFC;
      --surface: rgba(255, 255, 255, 0.8);
      --surface-elevated: rgba(241, 245, 249, 0.88);
      --surface-border: rgba(226, 232, 240, 0.88);
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-subtle: #64748B;
      --card-shadow: 0 25px 60px -15px rgba(15, 23, 42, 0.08);
      --dna-opacity: 0.4;
      --cell-glow: rgba(14, 165, 233, 0.1);
      --immune-glow: rgba(16, 185, 129, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      background-color: var(--canvas);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    h1, h2, h3, h4, .brand-heading {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    /* 3D Biological Scene Background */
    .bg-3d-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Volumetric Glowing Light Orbs */
    .glow-orb-1 {
      position: absolute;
      top: -15%;
      left: 10%;
      width: min(750px, 90vw);
      height: min(750px, 90vw);
      background: radial-gradient(circle, var(--cell-glow) 0%, rgba(29, 78, 216, 0.05) 50%, transparent 70%);
      filter: blur(60px);
      animation: floatSlow1 24s ease-in-out infinite alternate;
    }

    .glow-orb-2 {
      position: absolute;
      bottom: -15%;
      right: 5%;
      width: min(800px, 90vw);
      height: min(800px, 90vw);
      background: radial-gradient(circle, var(--immune-glow) 0%, rgba(5, 150, 105, 0.04) 50%, transparent 70%);
      filter: blur(70px);
      animation: floatSlow2 28s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatSlow1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-30px, 30px) scale(0.95); }
    }
    @keyframes floatSlow2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-35px, 35px) scale(1.05); }
      100% { transform: translate(30px, -25px) scale(0.92); }
    }

    /* Floating 3D Biological Objects */
    .floating-element {
      position: absolute;
      transform-style: preserve-3d;
      will-change: transform;
    }

    /* 3D DNA Helix (Left Side) */
    .dna-3d-wrap {
      top: 15%;
      left: 3%;
      width: 220px;
      height: 480px;
      opacity: var(--dna-opacity);
      animation: floatDna 16s ease-in-out infinite alternate;
    }
    @keyframes floatDna {
      0% { transform: translateY(0px) rotateY(0deg) rotateZ(-12deg); }
      50% { transform: translateY(-25px) rotateY(15deg) rotateZ(-8deg); }
      100% { transform: translateY(15px) rotateY(-15deg) rotateZ(-15deg); }
    }

    /* 3D Immune System Antibody Y-Structure (Right Upper) */
    .immune-y-wrap {
      top: 12%;
      right: 6%;
      width: 180px;
      height: 180px;
      opacity: var(--dna-opacity);
      animation: floatImmune 20s ease-in-out infinite alternate;
    }
    @keyframes floatImmune {
      0% { transform: translateY(0px) rotate(0deg) scale(1); }
      50% { transform: translateY(-30px) rotate(12deg) scale(1.06); }
      100% { transform: translateY(20px) rotate(-10deg) scale(0.96); }
    }

    /* 3D Living Bio-Cell Spheres (Bottom Left & Bottom Right) */
    .bio-cell-3d-1 {
      bottom: 8%;
      right: 8%;
      width: 220px;
      height: 220px;
      opacity: var(--dna-opacity);
      animation: floatCell 22s ease-in-out infinite alternate-reverse;
    }
    .bio-cell-3d-2 {
      bottom: 12%;
      left: 8%;
      width: 160px;
      height: 160px;
      opacity: calc(var(--dna-opacity) * 0.85);
      animation: floatCell 18s ease-in-out infinite alternate;
    }
    @keyframes floatCell {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); }
      50% { transform: translate(25px, -20px) rotate(45deg) scale(1.05); }
      100% { transform: translate(-20px, 25px) rotate(-30deg) scale(0.95); }
    }

    @media (max-width: 768px) {
      .dna-3d-wrap {
        left: -40px;
        top: 25%;
        width: 150px;
        height: 340px;
        opacity: 0.35;
      }
      .immune-y-wrap {
        right: -30px;
        top: 10%;
        width: 130px;
        height: 130px;
        opacity: 0.35;
      }
      .bio-cell-3d-1 {
        right: -30px;
        bottom: 5%;
        width: 150px;
        height: 150px;
        opacity: 0.3;
      }
      .bio-cell-3d-2 {
        display: none;
      }
    }

    /* Header Bar */
    header {
      position: relative;
      z-index: 10;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
    }

    .brand-header-lockup {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .brand-icon-wrap {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }
    .brand-wordmark-txt {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 500;
      font-size: 30px; /* 1:0.75 Golden Ratio (75% of 40px) */
      color: var(--text-main);
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .theme-toggle-btn {
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      padding: 0.45rem 1.1rem;
      border-radius: var(--radius-full);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      backdrop-filter: blur(14px);
      transition: all 0.2s;
      min-height: 40px;
    }
    .theme-toggle-btn:hover {
      border-color: var(--luminous);
      transform: translateY(-1px);
    }

    /* Central Minimalist Hero */
    .hero-container {
      position: relative;
      z-index: 10;
      max-width: 920px;
      width: 100%;
      margin: auto;
      padding: 3rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Tagline Badge */
    .tagline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      background: var(--surface-elevated);
      border: 1px solid var(--surface-border);
      padding: 0.5rem 1.4rem;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--vitality);
      margin-bottom: 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 25px rgba(0,0,0,0.12);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      background: var(--vitality);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--vitality);
      animation: pulseLive 2s infinite;
      flex-shrink: 0;
    }
    @keyframes pulseLive {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    /* Main Headline */
    .hero-title {
      font-size: clamp(2.5rem, 6.5vw, 4.8rem);
      line-height: 1.1;
      margin-bottom: 1.5rem;
      max-width: 860px;
      color: var(--text-main);
    }
    .text-gradient {
      background: linear-gradient(135deg, #38BDF8 0%, #1D4ED8 50%, #10B981 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Pure Mission Statement */
    .hero-mission-statement {
      font-size: clamp(1.15rem, 2.3vw, 1.45rem);
      color: var(--text-muted);
      max-width: 740px;
      font-weight: 400;
      line-height: 1.65;
    }
    .hero-mission-statement strong {
      color: var(--text-main);
      font-weight: 700;
    }

    /* Minimal Clean Footer */
    footer {
      position: relative;
      z-index: 10;
      border-top: 1px solid var(--surface-border);
      padding: 2rem 1.5rem;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body class="theme-dark">

  <!-- 3D Biological Health, DNA & Immune System Visual Scene -->
  <div class="bg-3d-scene">
    <!-- Ambient Radial Glows -->
    <div class="glow-orb-1"></div>
    <div class="glow-orb-2"></div>

    <!-- 1. 3D DNA Double-Helix Structure (Left) -->
    <div class="floating-element dna-3d-wrap">
      <svg width="100%" height="100%" viewBox="0 0 200 450" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="dna-strand-1" x1="0" y1="0" x2="200" y2="450" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#1D4ED8"/>
            <stop offset="100%" stop-color="#10B981"/>
          </linearGradient>
          <linearGradient id="dna-strand-2" x1="200" y1="0" x2="0" y2="450" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="50%" stop-color="#0EA5E9"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
          <radialGradient id="base-node-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
            <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.2"/>
          </radialGradient>
        </defs>

        <!-- DNA Phosphodiester Backbone Waves -->
        <path d="M 40 20 Q 160 80, 160 140 T 40 260 T 160 380" stroke="url(#dna-strand-1)" stroke-width="4" stroke-linecap="round" fill="none"/>
        <path d="M 160 20 Q 40 80, 40 140 T 160 260 T 40 380" stroke="url(#dna-strand-2)" stroke-width="4" stroke-linecap="round" fill="none"/>

        <!-- 3D Nitrogenous Base Pair Rungs & Hydrogen Bonds -->
        <line x1="50" y1="35" x2="150" y2="35" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" stroke-dasharray="4 4"/>
        <circle cx="50" cy="35" r="5" fill="#38BDF8"/>
        <circle cx="150" cy="35" r="5" fill="#10B981"/>

        <line x1="85" y1="80" x2="115" y2="80" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2.5"/>
        <circle cx="85" cy="80" r="4" fill="#0EA5E9"/>
        <circle cx="115" cy="80" r="4" fill="#10B981"/>

        <line x1="50" y1="140" x2="150" y2="140" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" stroke-dasharray="4 4"/>
        <circle cx="50" cy="140" r="5" fill="#1D4ED8"/>
        <circle cx="150" cy="140" r="5" fill="#38BDF8"/>

        <line x1="85" y1="200" x2="115" y2="200" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2.5"/>
        <circle cx="85" cy="200" r="4" fill="#10B981"/>
        <circle cx="115" cy="200" r="4" fill="#0EA5E9"/>

        <line x1="50" y1="260" x2="150" y2="260" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" stroke-dasharray="4 4"/>
        <circle cx="50" cy="260" r="5" fill="#38BDF8"/>
        <circle cx="150" cy="260" r="5" fill="#10B981"/>

        <line x1="85" y1="320" x2="115" y2="320" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2.5"/>
        <circle cx="85" cy="320" r="4" fill="#0EA5E9"/>
        <circle cx="115" cy="320" r="4" fill="#1D4ED8"/>

        <line x1="50" y1="380" x2="150" y2="380" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" stroke-dasharray="4 4"/>
        <circle cx="50" cy="380" r="5" fill="#10B981"/>
        <circle cx="150" cy="380" r="5" fill="#38BDF8"/>
      </svg>
    </div>

    <!-- 2. 3D Immune System Antibody Structure (Right Upper) -->
    <div class="floating-element immune-y-wrap">
      <svg width="100%" height="100%" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="imm-grad" x1="20" y1="20" x2="160" y2="160" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="50%" stop-color="#0EA5E9"/>
            <stop offset="100%" stop-color="#1D4ED8"/>
          </linearGradient>
        </defs>
        <!-- Antibody Y-Arms (Fab domain) & Stem (Fc domain) -->
        <path d="M 40 40 L 90 90 L 140 40" stroke="url(#imm-grad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 90 90 L 90 150" stroke="url(#imm-grad)" stroke-width="7" stroke-linecap="round"/>
        <!-- Antigen Binding Terminals with 3D Spheres -->
        <circle cx="40" cy="40" r="10" fill="#10B981" filter="drop-shadow(0 0 8px rgba(16,185,129,0.8))"/>
        <circle cx="140" cy="40" r="10" fill="#38BDF8" filter="drop-shadow(0 0 8px rgba(56,189,248,0.8))"/>
        <circle cx="90" cy="150" r="9" fill="#1D4ED8" filter="drop-shadow(0 0 8px rgba(29,78,216,0.8))"/>
        <!-- Core Hinge Region Disulfide Bond -->
        <circle cx="90" cy="90" r="6" fill="#F8FAFC"/>
      </svg>
    </div>

    <!-- 3. 3D Cellular Mitosis Spheres with Living Nucleus (Bottom Right) -->
    <div class="floating-element bio-cell-3d-1">
      <svg width="100%" height="100%" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cell-3d-grad-1" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
            <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#080B11" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="nuc-glow" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#10B981"/>
            <stop offset="100%" stop-color="#059669"/>
          </radialGradient>
        </defs>
        <!-- Outer Cellular Membrane -->
        <circle cx="100" cy="100" r="85" fill="url(#cell-3d-grad-1)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2"/>
        <!-- Organelle Rings -->
        <ellipse cx="100" cy="100" rx="70" ry="30" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" stroke-dasharray="6 4" transform="rotate(-25 100 100)"/>
        <!-- Mitochondria / Cellular Nucleus -->
        <circle cx="100" cy="100" r="22" fill="url(#nuc-glow)" filter="drop-shadow(0 0 12px rgba(16,185,129,0.9))"/>
      </svg>
    </div>

    <!-- 4. Secondary Bio-Cell Membrane (Bottom Left) -->
    <div class="floating-element bio-cell-3d-2">
      <svg width="100%" height="100%" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cell-3d-grad-2" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#10B981" stop-opacity="0.6"/>
            <stop offset="70%" stop-color="#059669" stop-opacity="0.15"/>
            <stop offset="100%" stop-color="#080B11" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle cx="80" cy="80" r="65" fill="url(#cell-3d-grad-2)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
        <circle cx="80" cy="80" r="14" fill="#38BDF8" filter="drop-shadow(0 0 10px rgba(56,189,248,0.8))"/>
      </svg>
    </div>
  </div>

  <!-- Header -->
  <header>
    <a href="#" class="brand-header-lockup">
      <!-- 40px Bio-Cell Icon -->
      <div class="brand-icon-wrap">
        <svg width="100%" height="100%" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z" fill="url(#hdr-cell-l)"/>
          <path d="M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z" fill="url(#hdr-cell-r)"/>
          <circle cx="50" cy="50" r="8" fill="#10B981"/>
          <defs>
            <linearGradient id="hdr-cell-l" x1="16" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38BDF8"/>
              <stop offset="1" stop-color="#1D4ED8"/>
            </linearGradient>
            <linearGradient id="hdr-cell-r" x1="84" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse">
              <stop stop-color="#059669"/>
              <stop offset="1" stop-color="#10B981"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <!-- 30px Wordmark (1:0.75 Golden Ratio) -->
      <span class="brand-wordmark-txt">tovelu</span>
    </a>

    <button class="theme-toggle-btn" onclick="toggleTheme()">
      <span id="theme-icon">🌙</span>
      <span id="theme-label">Night</span>
    </button>
  </header>

  <!-- Central Monumental Hero Section -->
  <main class="hero-container">
    
    <!-- Tagline Badge -->
    <div class="tagline-badge">
      <span class="pulse-dot"></span>
      <span>Toward better health</span>
    </div>

    <!-- Announcement Headline -->
    <h1 class="hero-title">
      We Are <span class="text-gradient">Coming Soon.</span>
    </h1>

    <!-- Pure Mission Statement -->
    <p class="hero-mission-statement">
      Building the universal health intelligence platform engineered for the daily life of <strong>all 8 billion humans on Earth</strong>.
    </p>

  </main>

  <!-- Clean Minimal Footer -->
  <footer>
    <div>
      <span style="font-family: 'Ubuntu', sans-serif; font-weight: 500; color: var(--text-main);">tovelu</span>
      <span>© 2026 Tovelu Inc. • Toward better health.</span>
    </div>
  </footer>

  <script>
    let isDark = true;
    function toggleTheme() {
      isDark = !isDark;
      document.body.className = isDark ? 'theme-dark' : 'theme-light';
      document.getElementById('theme-icon').innerText = isDark ? '🌙' : '☀️';
      document.getElementById('theme-label').innerText = isDark ? 'Night' : 'Day';
    }
  </script>
</body>
</html>

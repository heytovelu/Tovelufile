<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>TOVELU • Mobile Health Intelligence Intake Survey (42 Markers)</title>
  
  <!-- Favicon: Official Tovelu Mitosis Bio-Cell Logo (Razor Sharp) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />

  <!-- Google Fonts: Google Sans, Roboto, Ubuntu, JetBrains Mono & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700;800&family=Ubuntu:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  
  <!-- TDS Gemini CSS Framework -->
  <link rel="stylesheet" href="tovelu-design-system.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--gemini-bg);
      color: var(--gemini-text-main);
      font-family: 'Google Sans Text', 'Roboto', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Top Sticky App Bar */
    header.mobile-survey-header {
      width: 100%;
      height: 60px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--gemini-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--gemini-border-subtle);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-wordmark {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 500;
      font-size: 22px;
      color: var(--gemini-text-main);
    }

    /* Native Smartphone Frame */
    .phone-survey-container {
      width: 100%;
      max-width: 412px;
      min-height: calc(100vh - 60px);
      display: flex;
      flex-direction: column;
      background: var(--gemini-bg);
      position: relative;
    }

    /* Mobile Status Bar */
    .mobile-status-bar {
      height: 38px;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--gemini-text-main);
    }

    /* Question Scroll Area */
    .mobile-survey-content {
      padding: 16px 16px 110px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    .question-header {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .question-title {
      font-family: 'Google Sans Display', 'Google Sans', sans-serif;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--gemini-text-main);
    }
    .question-subtitle {
      font-size: 13px;
      color: var(--gemini-text-muted);
      line-height: 1.45;
    }

    /* Option List */
    .option-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* Dual Unit Toggles */
    .unit-toggle-wrap {
      display: inline-flex;
      background: var(--gemini-surface-container);
      padding: 3px;
      border-radius: 9999px;
      margin-bottom: 6px;
      width: fit-content;
    }
    .unit-toggle-btn {
      background: transparent;
      border: none;
      color: var(--gemini-text-muted);
      padding: 5px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .unit-toggle-btn.active {
      background: var(--gemini-surface);
      color: var(--gemini-sparkle-blue);
      box-shadow: var(--gemini-shadow-sm);
    }

    /* Range Presets */
    .range-presets-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .range-preset-pill {
      background: var(--gemini-surface-container);
      border: 1px solid var(--gemini-border-subtle);
      color: var(--gemini-text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .range-preset-pill:hover, .range-preset-pill.active {
      background: var(--gemini-sparkle-blue);
      color: #FFFFFF;
      border-color: var(--gemini-sparkle-blue);
    }

    /* Fixed Bottom Action Bar */
    .mobile-docked-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 412px;
      z-index: 100;
      background: var(--gemini-bg);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--gemini-border-subtle);
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-select {
      background: var(--gemini-surface);
      border: 1.5px solid var(--gemini-border);
      border-radius: 12px;
      padding: 10px 6px;
      font-size: 15px;
      font-weight: 700;
      color: var(--gemini-text-main);
      outline: none;
      text-align: center;
    }

    .alert-banner {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Mobile Bar -->
  <header class="mobile-survey-header">
    <div class="brand-lockup">
      <!-- TOVELU MITOSIS LOGO (RAZOR SHARP) -->
      <div class="tovelu-mitosis-anim">
        <svg width="28" height="28" viewBox="0 0 100 100" fill="none" shape-rendering="geometricPrecision">
          <path d="M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z" fill="url(#ms-cyan)"/>
          <path d="M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z" fill="url(#ms-emerald)"/>
          <circle cx="50" cy="50" r="8.5" fill="#00F5A0"/>
          <defs>
            <linearGradient id="ms-cyan" x1="16" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00C0FF"/><stop offset="1" stop-color="#0062FF"/></linearGradient>
            <linearGradient id="ms-emerald" x1="84" y1="16" x2="50" y2="84" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5A0"/><stop offset="1" stop-color="#00D06C"/></linearGradient>
          </defs>
        </svg>
      </div>
      <span class="brand-wordmark">tovelu</span>
    </div>

    <!-- Actions -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="gemini-btn gemini-btn-tonal" style="height: 30px; padding: 0 8px; font-size: 11px;" onclick="toggleTheme()">
        <span class="material-symbols-outlined" id="theme-icon-sym" style="font-size: 14px;">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- Slim Progress Bar -->
  <div style="width: 100%; height: 3px; background: var(--gemini-surface-container); overflow: hidden;">
    <div id="survey-progress-fill" style="height: 100%; width: 2%; background: var(--gemini-gradient-btn); transition: width 0.2s;"></div>
  </div>

  <!-- Smartphone Frame -->
  <div class="phone-survey-container">
    
    <!-- Status Bar -->
    <div class="mobile-status-bar">
      <span>09:41</span>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span class="material-symbols-outlined" style="font-size: 14px;">signal_cellular_alt</span>
        <span class="material-symbols-outlined" style="font-size: 14px;">wifi</span>
        <span class="material-symbols-outlined" style="font-size: 16px;">battery_full</span>
      </div>
    </div>

    <!-- Main Content Area -->
    <div class="mobile-survey-content">
      <div id="survey-alert" class="alert-banner">Please select an option to continue.</div>
      <div id="survey-content-area"></div>
    </div>

    <!-- Docked Bottom Navigation Bar -->
    <div class="mobile-docked-nav">
      <button class="gemini-btn gemini-btn-tonal" id="btn-prev" onclick="prevQuestion()" disabled style="height: 48px; padding: 0 16px;">
        ‹ Back
      </button>
      <button class="gemini-btn gemini-btn-primary" id="btn-next" onclick="nextQuestion()" style="height: 48px; flex: 1;">
        Continue ➔
      </button>
    </div>

  </div>

  <!-- Load Master 42-Question Dataset -->
  <script src="survey-data.js"></script>

  <!-- Survey Controller Script -->
  <script>
    let currentQIndex = 0;
    let userAnswers = {};

    function renderCurrentQuestion() {
      const q = TOVELU_SURVEY_QUESTIONS[currentQIndex];
      const stage = document.getElementById('survey-content-area');
      const progress = Math.round(((currentQIndex + 1) / TOVELU_SURVEY_QUESTIONS.length) * 100);

      const fillElem = document.getElementById('survey-progress-fill');
      if (fillElem) fillElem.style.width = `${progress}%`;
      const prevBtn = document.getElementById('btn-prev');
      if (prevBtn) prevBtn.disabled = currentQIndex === 0;

      hideAlert();

      if (q.type === 'dopamine') {
        stage.innerHTML = `
          <div class="gemini-card" style="text-align: center; padding: 24px 18px; display: flex; flex-direction: column; gap: 14px;">
            <div><span style="font-size: 10px; font-weight: 800; color: var(--gemini-vitality-emerald); background: var(--gemini-surface-container); padding: 3px 10px; border-radius: 9999px;">${q.badge}</span></div>
            <div style="font-family: 'Google Sans Display', sans-serif; font-size: 26px; font-weight: 800;">${q.gauge.value}</div>
            <div style="font-size: 12px; font-weight: 700; color: var(--gemini-sparkle-blue);">${q.gauge.percentile}</div>
            <div style="height: 6px; background: var(--gemini-surface-container); border-radius: 9999px; overflow: hidden;">
              <div style="height: 100%; width: ${q.gauge.barWidth}; background: var(--gemini-gradient-btn);"></div>
            </div>
            <p style="font-size: 12px; color: var(--gemini-text-muted); line-height: 1.5;">${q.data}</p>
          </div>
        `;
        document.getElementById('btn-next').innerText = q.isFinal ? "Unlock Protocol ➔" : "Next Milestone ➔";
        return;
      }

      document.getElementById('btn-next').innerText = "Continue ➔";

      let optionsHTML = '';
      if (q.type === 'single') {
        optionsHTML = `
          <div class="option-list">
            ${q.options.map((opt, i) => {
              const isSel = userAnswers[q.id] === opt.title;
              return `
                <div class="gemini-option-card ${isSel ? 'selected' : ''}" onclick="selectSingleOption('${q.id}', '${opt.title.replace(/'/g, "\\'")}', this)">
                  <div class="gemini-check-circle">${isSel ? '✓' : ''}</div>
                  <span style="font-size: 22px;">${opt.emoji}</span>
                  <div style="flex: 1;">
                    <div style="font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 14px;">${opt.title}</div>
                    <div style="font-size: 11px; color: var(--gemini-text-muted);">${opt.desc}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'multi') {
        if (!userAnswers[q.id]) userAnswers[q.id] = [];
        optionsHTML = `
          <div class="option-list">
            ${q.options.map((opt, i) => {
              const isSel = userAnswers[q.id].includes(opt.title);
              return `
                <div class="gemini-option-card ${isSel ? 'selected' : ''}" onclick="toggleMultiOption('${q.id}', '${opt.title.replace(/'/g, "\\'")}', this)">
                  <div class="gemini-check-circle">${isSel ? '✓' : ''}</div>
                  <span style="font-size: 22px;">${opt.emoji}</span>
                  <div style="flex: 1;">
                    <div style="font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 14px;">${opt.title}</div>
                    <div style="font-size: 11px; color: var(--gemini-text-muted);">${opt.desc}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else if (q.type === 'dob') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; gap: 8px;">
              <select class="time-select" id="dob-day" style="flex: 1;" onchange="updateCalculatedAgeMobile()">
                ${Array.from({length: 31}, (_, i) => `<option value="${i+1}">${i+1}</option>`).join('')}
              </select>
              <select class="time-select" id="dob-month" style="flex: 1.4;" onchange="updateCalculatedAgeMobile()">
                ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((m, idx) => `<option value="${idx+1}">${m}</option>`).join('')}
              </select>
              <select class="time-select" id="dob-year" style="flex: 1.2;" onchange="updateCalculatedAgeMobile()">
                ${Array.from({length: 85}, (_, i) => { const yr = (new Date().getFullYear()) - i; return `<option value="${yr}" ${yr===2001?'selected':''}>${yr}</option>`; }).join('')}
              </select>
            </div>
            <div id="dob-calculated-tag" style="background: var(--gemini-surface-container); padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--gemini-sparkle-blue); text-align: center;">
              👉 Calculated Age: 29 Years Old
            </div>
          </div>
        `;
      } else if (q.type === 'height') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 10px;">
            <div class="unit-toggle-wrap">
              <button class="unit-toggle-btn active" id="m-btn-cm" onclick="toggleMobileHeightUnit('cm')">Metric (cm)</button>
              <button class="unit-toggle-btn" id="m-btn-ft" onclick="toggleMobileHeightUnit('ft')">Imperial (ft/in)</button>
            </div>
            
            <div id="m-height-cm-wrap">
              <input type="number" class="gemini-prompt-input" id="input-height-cm" placeholder="175 cm" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 18px; font-weight: 700; width: 100%;" value="${userAnswers['height_num'] || '175'}" oninput="userAnswers['height_num']=this.value" />
              <div class="range-presets-grid">
                ${[155, 160, 165, 170, 175, 180, 185].map(h => `<div class="range-preset-pill ${userAnswers['height_num']==h?'active':''}" onclick="setMobileHeight(${h})">${h} cm</div>`).join('')}
              </div>
            </div>

            <div id="m-height-ft-wrap" style="display: none;">
              <div style="display: flex; gap: 8px;">
                <select class="time-select" id="m-height-feet" style="flex: 1;" onchange="convertMobileFtToCm()">
                  <option value="4">4 Feet</option><option value="5" selected>5 Feet</option><option value="6">6 Feet</option><option value="7">7 Feet</option>
                </select>
                <select class="time-select" id="m-height-inches" style="flex: 1;" onchange="convertMobileFtToCm()">
                  ${Array.from({length: 12}, (_, i) => `<option value="${i}" ${i===9?'selected':''}>${i} In</option>`).join('')}
                </select>
              </div>
            </div>
          </div>
        `;
      } else if (q.type === 'weight') {
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 10px;">
            <div class="unit-toggle-wrap">
              <button class="unit-toggle-btn active" id="m-btn-kg" onclick="toggleMobileWeightUnit('kg')">kg</button>
              <button class="unit-toggle-btn" id="m-btn-lbs" onclick="toggleMobileWeightUnit('lbs')">lbs</button>
            </div>
            <input type="number" class="gemini-prompt-input" id="input-weight" placeholder="70 kg" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 18px; font-weight: 700; width: 100%;" value="${userAnswers['weight_num'] || '70'}" oninput="userAnswers['weight_num']=this.value" />
            <div class="range-presets-grid">
              ${[55, 60, 65, 70, 75, 80, 85, 90].map(w => `<div class="range-preset-pill ${userAnswers['weight_num']==w?'active':''}" onclick="setMobileWeight(${w})">${w} kg</div>`).join('')}
            </div>
          </div>
        `;
      } else if (q.type === 'location') {
        const countriesList = (typeof TOVELU_GLOBAL_COUNTRIES !== 'undefined') ? TOVELU_GLOBAL_COUNTRIES : ["India", "United States", "United Kingdom", "United Arab Emirates", "Australia", "Canada", "Germany", "Singapore"];
        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 10px;">
            <div>
              <label style="font-size: 11px; font-weight: 700; color: var(--gemini-text-muted); margin-bottom: 4px; display: block;">Select Country (230+ Countries):</label>
              <select class="time-select" id="loc-country" style="width: 100%; text-align: left; padding: 10px;">
                ${countriesList.map(c => `<option value="${c}" ${c==='India'?'selected':''}>${c}</option>`).join('')}
              </select>
            </div>
            <div>
              <label style="font-size: 11px; font-weight: 700; color: var(--gemini-text-muted); margin-bottom: 4px; display: block;">Current Postal / PIN Code:</label>
              <input type="text" class="gemini-prompt-input" id="loc-pincode" placeholder="e.g. 400001 or 90210" style="border: 1.5px solid var(--gemini-border); border-radius: 12px; padding: 12px; font-size: 16px; font-weight: 700; width: 100%;" value="${userAnswers['pincode'] || ''}" />
            </div>
          </div>
        `;
      } else if (q.type === 'time_wake' || q.type === 'time_sleep') {
        const presets = q.type === 'time_wake' 
          ? [
              { val: "05:30 AM", label: "🌅 05:30 AM (Sunrise)" },
              { val: "06:00 AM", label: "🌅 06:00 AM" },
              { val: "06:30 AM", label: "🌅 06:30 AM" },
              { val: "07:00 AM", label: "☀️ 07:00 AM (Ideal)" },
              { val: "07:30 AM", label: "☀️ 07:30 AM" },
              { val: "08:00 AM", label: "☀️ 08:00 AM" }
            ]
          : [
              { val: "09:30 PM", label: "🌙 09:30 PM" },
              { val: "10:00 PM", label: "🌙 10:00 PM" },
              { val: "10:30 PM", label: "🌙 10:30 PM (Ideal)" },
              { val: "11:00 PM", label: "🌙 11:00 PM" },
              { val: "11:30 PM", label: "🌙 11:30 PM" },
              { val: "12:00 AM", label: "🌌 12:00 AM" }
            ];

        optionsHTML = `
          <div class="gemini-card" style="display: flex; flex-direction: column; gap: 10px;">
            <div style="font-weight: 700; font-size: 11px; color: var(--gemini-text-muted); text-transform: uppercase;">1-Tap Exact Times (Zero Typing)</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px;">
              ${presets.map(p => `<div class="range-preset-pill ${userAnswers[q.id] === p.val ? 'active' : ''}" style="text-align: center; padding: 10px;" onclick="selectTimePreset('${q.id}', '${p.val}')">${p.label}</div>`).join('')}
            </div>
          </div>
        `;
      }

      stage.innerHTML = `
        <div class="question-header">
          <h2 class="question-title">${q.title}</h2>
          <p class="question-subtitle">${q.subtitle}</p>
        </div>
        ${optionsHTML}
      `;
    }

    function selectSingleOption(qId, title, card) {
      userAnswers[qId] = title;
      document.querySelectorAll('.gemini-option-card').forEach(c => {
        c.classList.remove('selected');
        c.querySelector('.gemini-check-circle').innerText = '';
      });
      card.classList.add('selected');
      card.querySelector('.gemini-check-circle').innerText = '✓';
      hideAlert();
      setTimeout(nextQuestion, 160);
    }

    function toggleMultiOption(qId, title, card) {
      if (!userAnswers[qId]) userAnswers[qId] = [];
      const idx = userAnswers[qId].indexOf(title);
      if (idx > -1) {
        userAnswers[qId].splice(idx, 1);
        card.classList.remove('selected');
        card.querySelector('.gemini-check-circle').innerText = '';
      } else {
        userAnswers[qId].push(title);
        card.classList.add('selected');
        card.querySelector('.gemini-check-circle').innerText = '✓';
      }
      hideAlert();
    }

    function selectTimePreset(qId, val) {
      userAnswers[qId] = val;
      document.querySelectorAll('.range-preset-pill').forEach(c => c.classList.toggle('active', c.innerText.includes(val)));
      hideAlert();
      setTimeout(nextQuestion, 160);
    }

    function toggleMobileHeightUnit(u) {
      document.getElementById('m-btn-cm').className = u === 'cm' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('m-btn-ft').className = u === 'ft' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('m-height-cm-wrap').style.display = u === 'cm' ? 'block' : 'none';
      document.getElementById('m-height-ft-wrap').style.display = u === 'ft' ? 'block' : 'none';
    }

    function toggleMobileWeightUnit(u) {
      document.getElementById('m-btn-kg').className = u === 'kg' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('m-btn-lbs').className = u === 'lbs' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
    }

    function setMobileHeight(h) {
      userAnswers['height_num'] = h;
      document.getElementById('input-height-cm').value = h;
      document.querySelectorAll('.range-preset-pill').forEach(p => p.classList.toggle('active', p.innerText.startsWith(h.toString())));
    }

    function setMobileWeight(w) {
      userAnswers['weight_num'] = w;
      document.getElementById('input-weight').value = w;
      document.querySelectorAll('.range-preset-pill').forEach(p => p.classList.toggle('active', p.innerText.startsWith(w.toString())));
    }

    function convertMobileFtToCm() {
      const ft = parseInt(document.getElementById('m-height-feet').value) || 5;
      const inch = parseInt(document.getElementById('m-height-inches').value) || 9;
      const cm = Math.round(ft * 30.48 + inch * 2.54);
      userAnswers['height_num'] = cm;
    }

    function updateCalculatedAgeMobile() {
      const d = parseInt(document.getElementById('dob-day').value) || 1;
      const m = parseInt(document.getElementById('dob-month').value) || 1;
      const y = parseInt(document.getElementById('dob-year').value) || 2001;
      
      const now = new Date();
      let age = now.getFullYear() - y;
      const monthDiff = (now.getMonth() + 1) - m;
      if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < d)) {
        age--;
      }
      if (age < 0) age = 0;

      userAnswers['calculated_age'] = age;
      userAnswers['dob'] = `${d}/${m}/${y}`;
      const tag = document.getElementById('dob-calculated-tag');
      if (tag) tag.innerText = `👉 Calculated Age: ${age} Years Old`;
    }

    function saveInputs() {
      const q = TOVELU_SURVEY_QUESTIONS[currentQIndex];
      if (!q) return;
      if (q.type === 'dob') {
        userAnswers['dob'] = `${document.getElementById('dob-day').value}/${document.getElementById('dob-month').value}/${document.getElementById('dob-year').value}`;
      } else if (q.type === 'height') {
        userAnswers['height_num'] = document.getElementById('input-height-cm').value;
        userAnswers['height'] = `${userAnswers['height_num']} cm`;
      } else if (q.type === 'weight') {
        userAnswers['weight_num'] = document.getElementById('input-weight').value;
        userAnswers['weight'] = `${userAnswers['weight_num']} kg`;
      } else if (q.type === 'location') {
        userAnswers['country'] = document.getElementById('loc-country').value;
        userAnswers['pincode'] = document.getElementById('loc-pincode').value;
      }
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        saveInputs();
        currentQIndex--;
        renderCurrentQuestion();
      }
    }

    function nextQuestion() {
      const q = TOVELU_SURVEY_QUESTIONS[currentQIndex];
      if (q && q.type === 'dopamine' && q.isFinal) {
        finish();
        return;
      }
      saveInputs();
      if (q && q.type === 'single' && !userAnswers[q.id]) {
        showAlert('Please select an option to continue.');
        return;
      }
      if (q && q.type === 'multi' && (!userAnswers[q.id] || userAnswers[q.id].length === 0)) {
        showAlert('Please select at least one option to continue.');
        return;
      }
      if (currentQIndex < TOVELU_SURVEY_QUESTIONS.length - 1) {
        currentQIndex++;
        renderCurrentQuestion();
      } else {
        finish();
      }
    }

    function showAlert(msg) {
      const el = document.getElementById('survey-alert');
      el.innerText = msg;
      el.style.display = 'block';
    }
    function hideAlert() {
      const el = document.getElementById('survey-alert');
      if (el) el.style.display = 'none';
    }

    function finish() {
      localStorage.setItem('tovelu_survey_answers', JSON.stringify(userAnswers));
      if (window.top !== window.self) {
        window.top.location.href = "report.html";
      } else {
        window.location.href = "report.html";
      }
    }

    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme') || 'light';
      const nxt = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', nxt);
      document.body.className = nxt === 'dark' ? 'tds-theme-dark' : '';
      document.getElementById('theme-icon-sym').innerText = nxt === 'dark' ? 'light_mode' : 'dark_mode';
    }

    window.addEventListener('load', renderCurrentQuestion);
  </script>
</body>
</html>

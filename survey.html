      --luminous: #0284C7;
      --luminous-light: #E0F2FE;
      --vitality: #059669;
      --vitality-light: #ECFDF5;
      --warning: #D97706;
      --warning-light: #FFFBEB;
      --danger: #DC2626;

      --surface: #FFFFFF;
      --surface-elevated: #F1F5F9;
      --surface-active: #E2E8F0;
      --border: #E2E8F0;
      --border-focus: #38BDF8;

      --text-muted: #475569;
      --text-subtle: #94A3B8;

      --radius-md: 16px;
      --radius-lg: 24px;

      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;

      line-height: 1.5;

      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4, .brand-heading {

      font-weight: 800;
      letter-spacing: -0.03em;

      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
      backdrop-filter: blur(16px);

      align-items: center;

    }
    .brand-icon-wrap {

      height: 34px;

    .brand-wordmark-txt {

      font-weight: 500;
      font-size: 25.5px;
      color: var(--text-main);
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .survey-progress-container {
      flex: 1;
      max-width: 440px;
      margin: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .survey-progress-track {
      height: 8px;
      background: var(--surface-active);
      border-radius: var(--radius-full);
      overflow: hidden;
    }
    .survey-progress-bar {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--luminous), var(--primary));
      border-radius: var(--radius-full);
      transition: width 0.35s ease;
    }
    .survey-step-indicator {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;

      margin: 0 auto;
      padding: 2.5rem 1.25rem 7rem 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .question-card-wrapper {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .question-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 0.5rem;
    }
    .question-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .option-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.15rem 1.35rem;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      box-shadow: var(--shadow-sm);
    }
    .option-card:hover {
      border-color: var(--border-focus);
      background: var(--primary-subtle);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    .option-card:active {
      transform: scale(0.99);
    }
    .option-card.selected {
      border-color: var(--primary);
      background: var(--primary-subtle);
      box-shadow: 0 0 0 1px var(--primary), var(--shadow-md);
    }

    .option-check-circle {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
      background: white;
      transition: all 0.2s;

      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .option-emoji {
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .option-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-main);

    .option-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 3px;
      line-height: 1.4;

      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text-main);
      padding: 1rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 1.05rem;
      font-family: 'Inter', sans-serif;

      background: var(--surface-active);
      padding: 0.25rem;
      border-radius: var(--radius-full);

      }

      // Render Location (195 Countries Dropdown + City)
      if (q.type === 'location') {
        container.innerHTML = `
          <div>
            <h2 class="question-title">${q.title}</h2>
            <p class="question-subtitle">${q.subtitle}</p>

            <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 0.35rem;">SELECT COUNTRY (195 SOVEREIGN NATIONS)</label>
            <select class="survey-input" id="loc-country">
              ${COUNTRIES.map(c => `<option value="${c}" ${c === (userAnswers['country'] || 'India') ? 'selected' : ''}>${c}</option>`).join('')}
            </select>

            <label style="font-size: 0.75rem; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 0.35rem; margin-top: 1rem;">CITY / STATE / POSTAL CODE</label>
            <input type="text" class="survey-input" id="loc-city" placeholder="e.g. Mumbai, Maharashtra" value="${userAnswers['city'] || 'Mumbai, Maharashtra'}" />
          </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Render Time
      if (q.type === 'time') {
        container.innerHTML = `
          <div>
            <h2 class="question-title">${q.title}</h2>
            <p class="question-subtitle">${q.subtitle}</p>
            <input type="text" class="survey-input" id="time-input" placeholder="e.g. 06:30 AM" value="${userAnswers[q.id] || q.defaultVal}" />
          </div>
        `;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
    }

    function selectSingleCard(cardEl, qId, value) {
      document.querySelectorAll('.option-card').forEach(c => {
        c.classList.remove('selected');
        const check = c.querySelector('.option-check-circle');
        if (check) check.innerText = '';
      });

      cardEl.classList.add('selected');
      const check = cardEl.querySelector('.option-check-circle');
      if (check) check.innerText = '✓';

      userAnswers[qId] = value;
    }

    function toggleMultiCard(cardEl, qId, value) {
      cardEl.classList.toggle('selected');
      const check = cardEl.querySelector('.option-check-circle');
      if (cardEl.classList.contains('selected')) {
        if (check) check.innerText = '✓';
      } else {
        if (check) check.innerText = '';
      }

      if (!userAnswers[qId]) userAnswers[qId] = [];
      const idx = userAnswers[qId].indexOf(value);
      if (idx > -1) {
        userAnswers[qId].splice(idx, 1);
      } else {
        userAnswers[qId].push(value);
      }
    }

    function saveCurrentInputs() {
      const q = SURVEY_QUESTIONS[currentQIndex];
      if (!q) return;

      if (q.type === 'dob') {
        const d = document.getElementById('dob-day').value;
        const m = document.getElementById('dob-month').value;
        const y = document.getElementById('dob-year').value;
        userAnswers['dob'] = `${d} ${m} ${y}`;
      } else if (q.type === 'height') {
        if (currentHeightUnit === 'cm') {
          const val = document.getElementById('input-height-cm').value;
          userAnswers['height_num'] = val;
          userAnswers['height'] = `${val} cm`;
        } else {
          const ft = document.getElementById('input-height-ft').value;
          const inch = document.getElementById('input-height-in').value;
          userAnswers['height'] = `${ft} ft ${inch} in`;
        }
      } else if (q.type === 'weight') {
        const val = document.getElementById('input-weight').value;
        userAnswers['weight_num'] = val;
        userAnswers['weight'] = `${val} ${currentWeightUnit}`;
      } else if (q.type === 'location') {
        userAnswers['country'] = document.getElementById('loc-country').value;
        userAnswers['city'] = document.getElementById('loc-city').value;
      } else if (q.type === 'time') {
        userAnswers[q.id] = document.getElementById('time-input').value;
      }
    }

    let currentHeightUnit = 'cm';
    function toggleHeightUnit(unit) {
      currentHeightUnit = unit;
      document.getElementById('btn-cm').className = unit === 'cm' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('btn-ft').className = unit === 'ft' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('height-cm-wrap').style.display = unit === 'cm' ? 'block' : 'none';
      document.getElementById('height-ft-wrap').style.display = unit === 'ft' ? 'grid' : 'none';
    }

    let currentWeightUnit = 'kg';
    function toggleWeightUnit(unit) {
      currentWeightUnit = unit;
      document.getElementById('btn-kg').className = unit === 'kg' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
      document.getElementById('btn-lbs').className = unit === 'lbs' ? 'unit-toggle-btn active' : 'unit-toggle-btn';
    }

    function prevQuestion() {
      if (currentQIndex > 0) {
        saveCurrentInputs();
        currentQIndex--;
        renderCurrentQuestion();
      }
    }

    function nextQuestion() {
      const q = SURVEY_QUESTIONS[currentQIndex];
      
      // If dopamine card is final, finish
      if (q && q.type === 'dopamine' && q.isFinal) {
        finishSurvey();
        return;
      }

      saveCurrentInputs();

      // Check single select validation
      if (q && q.type === 'single' && !userAnswers[q.id]) {
        alert('Please select an option to continue.');
        return;
      }

      if (currentQIndex < SURVEY_QUESTIONS.length - 1) {
        currentQIndex++;
        renderCurrentQuestion();
      } else {
        finishSurvey();
      }
    }

    function finishSurvey() {
      localStorage.setItem('tovelu_survey_answers', JSON.stringify(userAnswers));
      localStorage.removeItem('tovelu_survey_state');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>

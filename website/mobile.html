<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tovelu • Mobile App Experience (Material 3 Compact)</title>
  
  <!-- Favicon: Official Tovelu Mitosis Bio-Cell Logo -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 16 C28 16, 16 32, 16 50 C16 68, 28 84, 50 84 C38 72, 34 58, 34 50 C34 42, 38 28, 50 16 Z' fill='%230091FF'/%3E%3Cpath d='M50 16 C72 16, 84 32, 84 50 C84 68, 72 84, 50 84 C62 72, 66 58, 66 50 C66 42, 62 28, 50 16 Z' fill='%2300E676'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%2300F5A0'/%3E%3C/svg%3E" />

  <!-- Google Fonts & TDS Framework -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Google+Sans:wght@400;500;700&family=Google+Sans+Text:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700;800&family=Ubuntu:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="tovelu-design-system.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      min-height: 100vh;
      background: #0B0E14;
      font-family: 'Google Sans Text', 'Roboto', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mobile-control-bar {
      width: 100%;
      height: 54px;
      background: #151921;
      border-bottom: 1px solid #232936;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #E2E8F0;
      z-index: 100;
    }
    .device-switcher-btn {
      background: #202736;
      border: 1px solid #2D3748;
      color: #A0AEC0;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .device-switcher-btn.active {
      background: #1A73E8;
      border-color: #1A73E8;
      color: #FFFFFF;
    }

    /* Photorealistic Smartphone Frame */
    .phone-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      width: 100%;
    }
    .phone-chassis {
      width: 414px;
      height: 852px;
      background: #000000;
      border-radius: 54px;
      padding: 12px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.75), 0 0 0 2px #334155, inset 0 0 0 2px #1E293B;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #FFFFFF;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
    }
    .island-cam {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #111827;
      border: 1px solid #1F2937;
    }
    .island-sensor {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #064E3B;
      opacity: 0.8;
    }
    iframe#phone-app-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #F0F4F9;
    }
  </style>
</head>
<body>

  <!-- Top Control Bar -->
  <header class="mobile-control-bar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="material-symbols-outlined" style="color: #00D06C; font-size: 20px;">smartphone</span>
      <span style="font-family: 'Google Sans', sans-serif; font-weight: 800; font-size: 14px;">Tovelu Mobile App (Real Mobile OS)</span>
      <span style="font-size: 11px; background: rgba(0, 208, 108, 0.15); color: #00E676; padding: 2px 8px; border-radius: 9999px; font-weight: 800;">
        MATERIAL 3 COMPACT
      </span>
    </div>

    <!-- Device Size Presets -->
    <div style="display: flex; align-items: center; gap: 8px;">
      <button class="device-switcher-btn active" id="btn-dev-iphone" onclick="setDeviceSize('iphone')">
        <span>iPhone 16 Pro (393px)</span>
      </button>
      <button class="device-switcher-btn" id="btn-dev-pixel" onclick="setDeviceSize('pixel')">
        <span>Pixel 9 (412px)</span>
      </button>
      <a href="desktop.html" class="device-switcher-btn" style="text-decoration: none;">
        <span class="material-symbols-outlined" style="font-size: 15px;">desktop_windows</span>
        <span>Desktop View</span>
      </a>
      <a href="app.html" target="_blank" class="device-switcher-btn" style="text-decoration: none;">
        <span class="material-symbols-outlined" style="font-size: 15px;">open_in_new</span>
        <span>Fullscreen</span>
      </a>
    </div>
  </header>

  <!-- Smartphone Stage -->
  <div class="phone-stage">
    <div class="phone-chassis" id="phone-chassis">
      <div class="phone-screen">
        <!-- Dynamic Island / Top Camera -->
        <div class="phone-island">
          <div class="island-cam"></div>
          <div class="island-sensor"></div>
        </div>
        
        <!-- Live App Iframe -->
        <iframe id="phone-app-iframe" src="app.html"></iframe>
      </div>
    </div>
  </div>

  <script>
    function setDeviceSize(type) {
      document.querySelectorAll('.device-switcher-btn').forEach(b => b.classList.remove('active'));
      const chassis = document.getElementById('phone-chassis');
      
      if (type === 'iphone') {
        document.getElementById('btn-dev-iphone').classList.add('active');
        chassis.style.width = '414px';
        chassis.style.height = '852px';
        chassis.style.borderRadius = '54px';
      } else if (type === 'pixel') {
        document.getElementById('btn-dev-pixel').classList.add('active');
        chassis.style.width = '432px';
        chassis.style.height = '880px';
        chassis.style.borderRadius = '48px';
      }
    }
  </script>
</body>
</html>
